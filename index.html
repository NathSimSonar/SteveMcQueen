<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Joyeux anniversaire – Le Mans 1971</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --asphalt: #0d0e11;
    --night: #14233a;
    --gulf: #7bbbe8;
    --orange: #ff6a13;
    --gold: #e9b824;
    --paper: #f5efe0;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --asphalt:#0d0e11; --night:#14233a; --gulf:#7bbbe8; --orange:#ff6a13; --gold:#e9b824; --paper:#f5efe0; }
  }
  :root[data-theme="dark"] { --asphalt:#0d0e11; --night:#14233a; --gulf:#7bbbe8; --orange:#ff6a13; --gold:#e9b824; --paper:#f5efe0; }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    margin: 0; height: 100%; overflow: hidden;
    font-family: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--paper);
    background:
      radial-gradient(ellipse 90% 45% at 50% 100%, rgba(255,106,19,.38), transparent 70%),
      radial-gradient(ellipse 60% 40% at 20% 0%, rgba(123,187,232,.16), transparent 70%),
      linear-gradient(#070b14, #14233a 62%, #1e1a1b);
  }
  body::before {
    content: ""; position: fixed; inset: 0 0 auto 0; height: 14px; z-index: 5;
    background: conic-gradient(var(--paper) 25%, var(--asphalt) 0 50%, var(--paper) 0 75%, var(--asphalt) 0) 0 0 / 28px 28px;
  }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }

  .brand {
    position: fixed; z-index: 4; left: 20px; top: calc(env(safe-area-inset-top, 0px) + 30px);
    font-family: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif;
    line-height: .95; pointer-events: none;
  }
  .brand b { display: block; font-size: clamp(2rem, 6vw, 3.4rem); font-weight: 900; color: var(--gold); letter-spacing: .01em; }
  .brand span { font-family: "Barlow", system-ui, sans-serif; font-size: .95rem; color: var(--gulf); font-weight: 500; }

  #sound {
    position: fixed; z-index: 4; right: 16px; top: calc(env(safe-area-inset-top, 0px) + 28px);
    background: rgba(13,14,17,.55); color: var(--paper); border: 1px solid rgba(245,239,224,.35);
    border-radius: 999px; padding: 8px 14px; font: 500 .9rem "Barlow", system-ui, sans-serif; cursor: pointer;
  }
  #sound:hover { border-color: var(--gold); }

  #hint {
    position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 28px);
    background: var(--orange); color: #1a0d03; border: 0; border-radius: 999px;
    padding: 14px 26px; font: 600 1.05rem "Barlow", system-ui, sans-serif; cursor: pointer;
    box-shadow: 0 0 0 0 rgba(255,106,19,.6); animation: ping 2.2s ease-out infinite;
    transition: opacity .4s;
  }
  #hint.gone { opacity: 0; pointer-events: none; animation: none; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(255,106,19,.55); } 80%, 100% { box-shadow: 0 0 0 22px rgba(255,106,19,0); } }

  #reveal {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 20px;
    padding-top: calc(env(safe-area-inset-top, 0px) + 20px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
    background: rgba(5,8,14,.55); backdrop-filter: blur(3px);
    opacity: 0; visibility: hidden; transition: opacity .45s, visibility 0s .45s;
  }
  #reveal.open { opacity: 1; visibility: visible; transition: opacity .45s; }
  .card {
    position: relative; width: min(94vw, 560px); max-height: 100%; overflow: auto;
    text-align: center; padding: 34px 28px 28px; background: var(--asphalt);
    border: 3px solid var(--gold); border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,.65);
    transform: translateY(24px) scale(.94); transition: transform .6s cubic-bezier(.2,1.2,.3,1);
  }
  #reveal.open .card { transform: none; }
  .card::before {
    content: ""; position: absolute; inset: 9px; border: 2px dashed rgba(233,184,36,.65);
    border-radius: 11px; pointer-events: none;
  }
  .card h1 {
    margin: 0; font-family: "Big Shoulders Display", Impact, "Arial Narrow", sans-serif; font-weight: 900;
    font-size: clamp(2.6rem, 11vw, 4.6rem); line-height: .92; text-transform: uppercase; color: var(--gold);
    letter-spacing: .01em; text-wrap: balance;
  }
  .card h1 small { display: block; margin-top: 6px; font-size: .5em; font-weight: 800; color: var(--gulf); }
  .discwrap { position: relative; margin: 22px auto 18px; width: min(66vw, 300px); aspect-ratio: 1; }
  .disc {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff8e8, #d3e4f0 70%);
    border: 6px solid var(--orange);
    box-shadow: inset 0 0 0 6px var(--asphalt), inset 0 0 0 9px var(--gulf);
  }
  .cap {
    position: absolute; left: 50%; top: 50%; width: 92%; height: auto; transform: translate(-50%, -50%) rotate(-6deg);
    filter: drop-shadow(0 10px 12px rgba(0,0,0,.45));
  }
  #reveal.open .cap { animation: drop .9s .35s cubic-bezier(.3,1.3,.4,1) both; }
  @keyframes drop {
    0% { transform: translate(-50%, -260%) rotate(-30deg) scale(.6); opacity: 0; }
    100% { transform: translate(-50%, -50%) rotate(-6deg) scale(1); opacity: 1; }
  }
  .card p { margin: 0 auto 22px; max-width: 34ch; font-size: 1.12rem; line-height: 1.5; color: var(--paper); }
  .card button {
    background: var(--gulf); color: #07121c; border: 0; border-radius: 999px; padding: 13px 26px;
    font: 600 1rem "Barlow", system-ui, sans-serif; cursor: pointer;
  }
  .card button:hover { background: #a5d2f2; }
  button:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    #hint { animation: none; }
    #reveal.open .cap { animation: none; }
    .card { transition: none; }
  }
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  // Pour personnaliser : écris le prénom ici, par exemple "Paul"
  var PRENOM = "";

  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var reveal = document.getElementById("reveal");
  var hint = document.getElementById("hint");
  var soundBtn = document.getElementById("sound");
  var soundOn = true;

  if (PRENOM) document.getElementById("who").textContent = PRENOM + " !";

  /* ---------- Son : un petit rugissement de moteur ---------- */
  var actx;
  function rev() {
    if (!soundOn) return;
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      if (actx.state === "suspended") actx.resume();
      var t = actx.currentTime;
      var o1 = actx.createOscillator(), o2 = actx.createOscillator();
      var g = actx.createGain(), f = actx.createBiquadFilter();
      o1.type = "sawtooth"; o2.type = "square"; f.type = "lowpass";
      f.frequency.setValueAtTime(400, t);
      f.frequency.exponentialRampToValueAtTime(2600, t + 1.1);
      f.frequency.exponentialRampToValueAtTime(700, t + 2);
      [[o1, 1], [o2, 1.5]].forEach(function (p) {
        p[0].frequency.setValueAtTime(52 * p[1], t);
        p[0].frequency.exponentialRampToValueAtTime(250 * p[1], t + 1.1);
        p[0].frequency.exponentialRampToValueAtTime(85 * p[1], t + 2);
        p[0].connect(f); p[0].start(t); p[0].stop(t + 2.2);
      });
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.12);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.1);
      f.connect(g); g.connect(actx.destination);
    } catch (e) {}
  }
  soundBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    soundBtn.textContent = "Son : " + (soundOn ? "oui" : "non");
    soundBtn.setAttribute("aria-pressed", String(soundOn));
  });

  /* ---------- Confettis ---------- */
  var cf = document.getElementById("confetti"), cx = cf.getContext("2d");
  var parts = [], cfRaf = 0;
  function sizeConfetti() {
    var d = Math.min(window.devicePixelRatio || 1, 2);
    cf.width = innerWidth * d; cf.height = innerHeight * d;
    cx.setTransform(d, 0, 0, d, 0, 0);
  }
  sizeConfetti();
  function burst() {
    var colors = ["#e9b824", "#7bbbe8", "#ff6a13", "#f5efe0", "#0d0e11"];
    var n = reduceMotion ? 25 : 90;
    for (var k = 0; k < 2; k++) {
      var ox = k ? innerWidth * 0.88 : innerWidth * 0.12, oy = innerHeight * 0.85;
      for (var i = 0; i < n; i++) {
        var a = -Math.PI / 2 + (k ? -1 : 1) * Math.random() * 0.75;
        var s = 9 + Math.random() * 11;
        parts.push({ x: ox, y: oy, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
          w: 6 + Math.random() * 7, h: 6 + Math.random() * 7, r: Math.random() * 6, vr: (Math.random() - .5) * .4,
          c: colors[(Math.random() * colors.length) | 0], life: 1 });
      }
    }
    if (!cfRaf) cfRaf = requestAnimationFrame(tickConfetti);
  }
  function tickConfetti() {
    cx.clearRect(0, 0, innerWidth, innerHeight);
    parts = parts.filter(function (p) { return p.life > 0 && p.y < innerHeight + 30; });
    parts.forEach(function (p) {
      p.vy += 0.28; p.vx *= 0.985; p.vy *= 0.985; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life -= 0.004;
      cx.save(); cx.translate(p.x, p.y); cx.rotate(p.r); cx.globalAlpha = Math.max(p.life, 0);
      cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      if (p.c === "#0d0e11") { cx.strokeStyle = "#f5efe0"; cx.lineWidth = 1; cx.strokeRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      cx.restore();
    });
    cfRaf = parts.length ? requestAnimationFrame(tickConfetti) : 0;
    if (!parts.length) cx.clearRect(0, 0, innerWidth, innerHeight);
  }

  /* ---------- Révélation ---------- */
  var revving = 0; // timestamp de début
  function trigger() {
    hint.classList.add("gone");
    revving = performance.now();
    rev();
    setTimeout(function () {
      reveal.classList.add("open");
      document.getElementById("close").focus({ preventScroll: true });
      burst();
      setTimeout(burst, 450);
    }, reduceMotion ? 100 : 1100);
  }
  function closeReveal() { reveal.classList.remove("open"); }
  document.getElementById("close").addEventListener("click", closeReveal);
  reveal.addEventListener("click", function (e) { if (e.target === reveal) closeReveal(); });
  window.addEventListener("keydown", function (e) { if (e.key === "Escape") closeReveal(); });

  /* ---------- Scène 3D ---------- */
  var canvas = document.getElementById("scene");
  try {
    if (!window.THREE) throw new Error("three");

    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.outputEncoding = THREE.sRGBEncoding;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
    camera.position.set(5.4, 2.1, 5.6);

    var controls = new THREE.OrbitControls(camera, canvas);
    controls.target.set(0.1, 0.55, 0);
    controls.enableDamping = true;
    controls.enablePan = false;
    controls.minDistance = 5; controls.maxDistance = 12;
    controls.minPolarAngle = 0.9; controls.maxPolarAngle = 1.5;
    controls.autoRotate = !reduceMotion; controls.autoRotateSpeed = 0.9;

    /* lumières */
    scene.add(new THREE.HemisphereLight(0xa9cdf5, 0x2a1a10, 0.85));
    var key = new THREE.DirectionalLight(0xfff0d8, 1.5);
    key.position.set(4, 7, 3); key.castShadow = true;
    key.shadow.mapSize.set(2048, 2048);
    key.shadow.camera.left = -5; key.shadow.camera.right = 5; key.shadow.camera.top = 5; key.shadow.camera.bottom = -5;
    key.shadow.bias = -0.0004;
    scene.add(key);
    var rim = new THREE.DirectionalLight(0x7bbbe8, 1.1); rim.position.set(-5, 3, -4); scene.add(rim);
    var warm = new THREE.DirectionalLight(0xff8a3c, 0.7); warm.position.set(5, 1.5, -4); scene.add(warm);

    /* plateau : asphalte, ligne pointillée, anneau doré */
    function discTexture() {
      var c = document.createElement("canvas"); c.width = c.height = 1024;
      var g = c.getContext("2d");
      g.fillStyle = "#17181c"; g.fillRect(0, 0, 1024, 1024);
      for (var i = 0; i < 9000; i++) {
        var v = 20 + Math.random() * 28;
        g.fillStyle = "rgba(" + v + "," + v + "," + (v + 4) + ",.55)";
        g.fillRect(Math.random() * 1024, Math.random() * 1024, 2, 2);
      }
      g.strokeStyle = "#f5efe0"; g.lineWidth = 8; g.setLineDash([46, 34]);
      g.beginPath(); g.arc(512, 512, 395, 0, Math.PI * 2); g.stroke();
      g.setLineDash([]); g.strokeStyle = "#e9b824"; g.lineWidth = 16;
      g.beginPath(); g.arc(512, 512, 494, 0, Math.PI * 2); g.stroke();
      var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
    }
    var disc = new THREE.Mesh(new THREE.CylinderGeometry(3.7, 3.7, 0.12, 96),
      [new THREE.MeshStandardMaterial({ color: 0x0f1013, roughness: .8 }),
       new THREE.MeshStandardMaterial({ map: discTexture(), roughness: .85, metalness: .05 }),
       new THREE.MeshStandardMaterial({ color: 0x0f1013, roughness: .8 })]);
    disc.position.y = -0.06; disc.receiveShadow = true; scene.add(disc);

    /* voiture */
    var car = new THREE.Group(); scene.add(car);
    var BLUE = 0x6fb7e9, ORANGE = 0xff6a13;
    var bodyMat = new THREE.MeshStandardMaterial({ color: BLUE, roughness: .32, metalness: .25 });

    var s = new THREE.Shape();
    s.moveTo(-2.3, 0.28);
    s.lineTo(2.1, 0.28);
    s.quadraticCurveTo(2.4, 0.3, 2.4, 0.45);
    s.quadraticCurveTo(2.4, 0.58, 2.15, 0.6);
    s.bezierCurveTo(1.7, 0.66, 1.5, 0.7, 1.1, 0.74);
    s.lineTo(0.3, 0.77);
    s.bezierCurveTo(-0.2, 0.8, -0.8, 0.8, -1.2, 0.78);
    s.bezierCurveTo(-1.7, 0.78, -2.0, 0.82, -2.3, 0.86);
    s.lineTo(-2.3, 0.28);
    var bodyGeo = new THREE.ExtrudeGeometry(s, { depth: 1.3, bevelEnabled: true, bevelThickness: 0.15, bevelSize: 0.12, bevelSegments: 6, curveSegments: 32 });
    bodyGeo.translate(0, 0, -0.65);
    bodyGeo.computeVertexNormals();
    var body = new THREE.Mesh(bodyGeo, bodyMat);
    body.castShadow = true; body.receiveShadow = true; car.add(body);
    car.updateMatrixWorld(true);

    var ray = new THREE.Raycaster();
    function hitDown(x, z) {
      ray.set(new THREE.Vector3(x, 3, z), new THREE.Vector3(0, -1, 0));
      var h = ray.intersectObject(body)[0]; return h || null;
    }

    /* bande orange centrale (suit le profil du capot au becquet) */
    var pos = [], idx = [], n = 0;
    for (var x = -2.4; x <= 2.5; x += 0.04) {
      var a = hitDown(x, -0.17), b = hitDown(x, 0.17);
      if (!a || !b) continue;
      pos.push(x, a.point.y + 0.006, -0.17, x, b.point.y + 0.006, 0.17);
      if (n > 0) { var i0 = (n - 1) * 2; idx.push(i0, i0 + 1, i0 + 2, i0 + 1, i0 + 3, i0 + 2); }
      n++;
    }
    var stripeGeo = new THREE.BufferGeometry();
    stripeGeo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    stripeGeo.setIndex(idx); stripeGeo.computeVertexNormals();
    car.add(new THREE.Mesh(stripeGeo, new THREE.MeshStandardMaterial({ color: ORANGE, roughness: .4, metalness: .1, side: THREE.DoubleSide, polygonOffset: true, polygonOffsetFactor: -2, polygonOffsetUnits: -2 })));

    /* médaillons n° 20 */
    function roundelTex() {
      var c = document.createElement("canvas"); c.width = c.height = 256;
      var g = c.getContext("2d");
      g.fillStyle = "#f7f3e8"; g.beginPath(); g.arc(128, 128, 122, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "#0d0e11"; g.lineWidth = 6; g.beginPath(); g.arc(128, 128, 118, 0, Math.PI * 2); g.stroke();
      g.fillStyle = "#0d0e11"; g.font = "900 150px Impact, 'Arial Black', sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("20", 128, 140);
      var t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
    }
    var rTex = roundelTex();
    var rMat = new THREE.MeshStandardMaterial({ map: rTex, transparent: true, roughness: .5, polygonOffset: true, polygonOffsetFactor: -4, polygonOffsetUnits: -4 });
    var hood = hitDown(1.6, 0);
    if (hood) {
      var hm = new THREE.Mesh(new THREE.PlaneGeometry(0.52, 0.52), rMat);
      var nrm = hood.face.normal.clone();
      hm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), nrm);
      hm.rotateZ(-Math.PI / 2);
      hm.position.copy(hood.point).addScaledVector(nrm, 0.012);
      car.add(hm);
    }
    [1, -1].forEach(function (sd) {
      var m = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.5), rMat);
      m.position.set(-0.75, 0.55, sd * 0.812);
      if (sd < 0) m.rotation.y = Math.PI;
      car.add(m);
    });

    /* ailes (dômes) et roues */
    function fender(x, y, z, sx, sy, sz) {
      var m = new THREE.Mesh(new THREE.SphereGeometry(1, 48, 24, 0, Math.PI * 2, 0, Math.PI / 2),
        new THREE.MeshStandardMaterial({ color: BLUE, roughness: .32, metalness: .25, side: THREE.DoubleSide }));
      m.scale.set(sx, sy, sz); m.position.set(x, y, z); m.castShadow = true; car.add(m);
    }
    var wheels = [];
    var tireMat = new THREE.MeshStandardMaterial({ color: 0x0a0a0b, roughness: .9 });
    var rimMat = new THREE.MeshStandardMaterial({ color: 0xcfd3d8, roughness: .25, metalness: .9 });
    var hubMat = new THREE.MeshStandardMaterial({ color: ORANGE, roughness: .4, metalness: .4 });
    function wheel(x, z, r, w) {
      var g = new THREE.Group();
      var tire = new THREE.Mesh(new THREE.CylinderGeometry(r, r, w, 40), tireMat); tire.rotation.x = Math.PI / 2; tire.castShadow = true; g.add(tire);
      var rim = new THREE.Mesh(new THREE.CylinderGeometry(r * .68, r * .68, w + 0.02, 32), rimMat); rim.rotation.x = Math.PI / 2; g.add(rim);
      for (var i = 0; i < 5; i++) {
        var sp = new THREE.Mesh(new THREE.BoxGeometry(r * 1.2, r * .12, w + 0.04), new THREE.MeshStandardMaterial({ color: 0x2a2d33, roughness: .4, metalness: .7 }));
        sp.rotation.z = i * Math.PI * 2 / 5; g.add(sp);
      }
      var hub = new THREE.Mesh(new THREE.CylinderGeometry(r * .17, r * .17, w + 0.08, 16), hubMat); hub.rotation.x = Math.PI / 2; g.add(hub);
      g.position.set(x, r, z); car.add(g); wheels.push(g);
    }
    fender(1.5, 0.44, 0.86, 0.78, 0.5, 0.46);  fender(1.5, 0.44, -0.86, 0.78, 0.5, 0.46);
    fender(-1.3, 0.46, 0.9, 0.98, 0.6, 0.5);   fender(-1.3, 0.46, -0.9, 0.98, 0.6, 0.5);
    wheel(1.5, 0.88, 0.4, 0.4);  wheel(1.5, -0.88, 0.4, 0.4);
    wheel(-1.3, 0.92, 0.44, 0.5); wheel(-1.3, -0.92, 0.44, 0.5);

    /* cockpit : bulle vitrée et casque du pilote */
    var glass = new THREE.Mesh(new THREE.SphereGeometry(1, 40, 20, 0, Math.PI * 2, 0, Math.PI / 2),
      new THREE.MeshStandardMaterial({ color: 0x0f1722, roughness: .08, metalness: .6, transparent: true, opacity: .62, side: THREE.DoubleSide }));
    glass.scale.set(0.85, 0.38, 0.6); glass.position.set(0.45, 0.8, 0); car.add(glass);
    var helmet = new THREE.Mesh(new THREE.SphereGeometry(0.15, 24, 16), new THREE.MeshStandardMaterial({ color: 0xf2efe6, roughness: .35 }));
    helmet.position.set(0.3, 0.9, 0); car.add(helmet);
    var visor = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.06, 0.2), new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: .2, metalness: .5 }));
    visor.position.set(0.43, 0.92, 0); car.add(visor);

    /* dérives arrière */
    var fs = new THREE.Shape();
    fs.moveTo(-2.35, 0.75); fs.lineTo(-1.0, 0.97); fs.lineTo(-1.0, 1.07); fs.lineTo(-2.35, 1.32); fs.lineTo(-2.35, 0.75);
    var finGeo = new THREE.ExtrudeGeometry(fs, { depth: 0.045, bevelEnabled: false });
    finGeo.translate(0, 0, -0.022);
    [0.97, -0.97].forEach(function (z) {
      var f = new THREE.Mesh(finGeo, bodyMat); f.position.z = z; f.castShadow = true; car.add(f);
    });

    /* phares, feux, splitter */
    var lampMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff3c4, emissiveIntensity: 0.5 });
    [1, -1].forEach(function (sd) {
      var l = new THREE.Mesh(new THREE.SphereGeometry(0.12, 20, 14), lampMat); l.position.set(2.05, 0.74, sd * 0.8); l.scale.set(1, .85, 1); car.add(l);
      var t = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.1, 0.28), new THREE.MeshStandardMaterial({ color: 0xff2a1a, emissive: 0xff1a0a, emissiveIntensity: .8 }));
      t.position.set(-2.44, 0.62, sd * 0.5); car.add(t);
    });
    var split = new THREE.Mesh(new THREE.BoxGeometry(0.34, 0.04, 1.7), new THREE.MeshStandardMaterial({ color: 0x0c0c0e, roughness: .6 }));
    split.position.set(2.42, 0.2, 0); car.add(split);
    var under = new THREE.Mesh(new THREE.BoxGeometry(4.6, 0.05, 1.4), new THREE.MeshStandardMaterial({ color: 0x0a0a0c }));
    under.position.set(0, 0.2, 0); car.add(under);

    car.position.y = 0.0;
    car.rotation.y = -0.35;

    /* taille, interaction */
    function resize() {
      var w = innerWidth, h = innerHeight, asp = w / h;
      renderer.setSize(w, h, false);
      camera.aspect = asp;
      camera.fov = asp < 1 ? Math.min(78, 40 / Math.pow(asp, 0.75)) : 40;
      camera.updateProjectionMatrix();
      sizeConfetti();
    }
    window.addEventListener("resize", resize); resize();

    var ptr = new THREE.Vector2(), caster = new THREE.Raycaster();
    function overCar(e) {
      var r = canvas.getBoundingClientRect();
      ptr.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
      caster.setFromCamera(ptr, camera);
      return caster.intersectObject(car, true).length > 0;
    }
    var down = null;
    canvas.addEventListener("pointerdown", function (e) { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
    canvas.addEventListener("pointerup", function (e) {
      if (!down) return;
      var moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
      down = null;
      if (moved < 8 && dt < 600 && overCar(e) && !revving) trigger();
      else if (moved < 8 && dt < 600 && overCar(e) && revving) { revving = performance.now(); rev(); burst(); }
    });
    canvas.addEventListener("pointermove", function (e) { canvas.style.cursor = overCar(e) ? "pointer" : "grab"; });
    hint.addEventListener("click", trigger);

    var clock = new THREE.Clock();
    function frame() {
      var t = clock.getElapsedTime();
      lampMat.emissiveIntensity = 0.55 + 0.35 * Math.sin(t * 3);
      var shake = 0, spin = 0;
      if (revving) {
        var k = (performance.now() - revving) / 1000;
        if (k < 2) {
          var env = Math.sin(Math.min(k / 2, 1) * Math.PI);
          shake = Math.sin(t * 90) * 0.008 * env; spin = env * 0.9;
          lampMat.emissiveIntensity = 1.6;
        }
      }
      car.position.y = shake;
      wheels.forEach(function (w) { w.rotation.z -= spin; });
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(frame);
    }
    frame();
  } catch (err) {
    // Si la 3D n'est pas disponible, le bouton ouvre quand même la surprise
    canvas.style.display = "none";
    hint.textContent = "Ouvre ta surprise";
    hint.addEventListener("click", trigger);
  }
})();
</script>
</body>
